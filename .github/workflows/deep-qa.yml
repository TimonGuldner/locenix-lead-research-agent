name: LOCENIX Deep QA Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake_qa.txt
      - tasks/qa_task.json
  schedule:
    - cron: "27,57 6-15 * * *"

permissions:
  contents: write

concurrency:
  group: locenix-deep-qa
  cancel-in-progress: false

jobs:
  deep-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check QA task and active window
        id: gate
        shell: bash
        run: |
          ENABLED=$(python - <<'PY'
          import json
          print(str(json.load(open('tasks/qa_task.json')).get('enabled', False)).lower())
          PY
          )
          if [[ "$ENABLED" != "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            LOCAL_HOUR=$(TZ=Europe/Berlin date +%H)
            HOUR=$((10#$LOCAL_HOUR))
            if (( HOUR < 8 || HOUR >= 16 )); then
              echo "Outside 08:00-16:00 Europe/Berlin; skipping scheduled deep QA."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run LOCENIX Deep QA Agent
        if: steps.gate.outputs.run == 'true'
        run: python -m agent.deep_qa_agent

      - name: Commit deep QA results
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "locenix-deep-qa-agent"
          git config user.email "actions@users.noreply.github.com"
          git add results/deep_qa_results.json results/deep_qa_state.json results/deep_qa_latest.json
          if git diff --cached --quiet; then
            echo "No deep QA changes to commit."
            exit 0
          fi
          git commit -m "Update LOCENIX deep QA results"
          git pull --rebase origin main
          git push origin HEAD:main
