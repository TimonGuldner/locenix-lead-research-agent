name: LOCENIX Sales Queue Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake_sales_queue.txt
      - tasks/sales_queue_task.json
  schedule:
    - cron: "7,37 6-13 * * *"

permissions:
  contents: write

concurrency:
  group: locenix-sales-queue
  cancel-in-progress: false

jobs:
  sales-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check sales queue task
        id: gate
        shell: bash
        run: |
          ENABLED=$(python - <<'PY'
          import json
          print(str(json.load(open('tasks/sales_queue_task.json')).get('enabled', False)).lower())
          PY
          )
          if [[ "$ENABLED" == "true" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run LOCENIX Sales Queue Agent
        if: steps.gate.outputs.run == 'true'
        run: python -m agent.sales_queue_agent

      - name: Commit sales queue results
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "locenix-sales-queue-agent"
          git config user.email "actions@users.noreply.github.com"
          git add results/sales_queue.json results/sales_queue_state.json results/sales_queue_latest.json
          if git diff --cached --quiet; then
            echo "No sales queue changes to commit."
            exit 0
          fi
          git commit -m "Update LOCENIX sales queue"
          git pull --rebase origin main
          git push origin HEAD:main
