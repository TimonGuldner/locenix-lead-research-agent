[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locenix-lead-research-agent"
version = "0.1.0"
description = "GitHub Actions Browser Use agent for qualitative LOCENIX local-business lead research"
requires-python = ">=3.12,<4.0"
dependencies = [
  "browser-use==0.13.10",
  "playwright>=1.55,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.setuptools]
packages = ["agent"]
