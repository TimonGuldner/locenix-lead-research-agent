name: LOCENIX Growth Manager

on:
  workflow_dispatch:
  push:
    paths:
      - 'wake_department_head.txt'
      - 'tasks/department_head_task.json'
      - 'tasks/departments/**'
      - 'tasks/agents/**'
      - 'agent/department_head_agent.py'
      - 'agent/hard_email_gate_enforcer.py'
      - 'results/email_conversation_state.json'
      - 'results/email_sender_state.json'
      - 'results/sales_queue_state.json'
      - 'results/deep_qa_state.json'
      - 'results/visibility_state.json'
  schedule:
    - cron: '12,42 6-18 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: locenix-department-head
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Europe Berlin business-hours gate
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Berlin'))
          if not (8 <= now.hour < 20):
              raise SystemExit('Outside 08:00-20:00 Europe/Berlin')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce hard Maps email gate
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appuPKnVyLsbWbxMR
          AIRTABLE_TABLE_ID: tblF4ghkYFzkeQwsT
        run: python -m agent.hard_email_gate_enforcer

      - name: Run LOCENIX Growth Manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.department_head_agent

      - name: Commit manager and gate reports
        run: |
          git config user.name 'locenix-growth-manager'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            results/department_head_latest.json \
            results/department_head_state.json \
            results/hard_email_gate_latest.json \
            results/hard_email_gate_state.json \
            results/deep_qa_state.json \
            results/visibility_results.json \
            results/visibility_state.json
          if git diff --cached --quiet; then
            echo 'No manager or gate report changes'
          else
            git commit -m 'Update LOCENIX hard email gate and department head report'
            git pull --rebase
            git push
          fi

      - name: Dispatch CEO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ceo.yml --ref main
