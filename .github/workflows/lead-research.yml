name: LOCENIX Lead Research Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - wake.txt
      - tasks/current_task.json
  schedule:
    - cron: "17,47 6-15 * * *"

permissions:
  contents: write

concurrency:
  group: locenix-lead-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check task and active window
        id: gate
        shell: bash
        run: |
          ENABLED=$(python - <<'PY'
          import json
          task=json.load(open('tasks/current_task.json'))
          print(str(task.get('enabled', False)).lower())
          PY
          )
          MODE=$(python - <<'PY'
          import json
          print(json.load(open('tasks/current_task.json')).get('mode','deterministic_research'))
          PY
          )
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [[ "$ENABLED" != "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            LOCAL_HOUR=$(TZ=Europe/Berlin date +%H)
            HOUR=$((10#$LOCAL_HOUR))
            if (( HOUR < 8 || HOUR >= 16 )); then
              echo "Outside 08:00-16:00 Europe/Berlin; skipping scheduled research."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run Google Maps smoke test
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'smoke_test'
        run: python -m agent.maps_smoke_test

      - name: Run deterministic Germany-wide research batch
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'deterministic_research'
        run: python -m agent.deterministic_research

      - name: Run LOCENIX sales intelligence qualification
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'deterministic_research'
        run: python -m agent.sales_intelligence

      - name: Run legacy LLM research batch
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'legacy_llm_research'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python -m agent.research_worker

      - name: Commit research state and results
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "locenix-lead-research-agent"
          git config user.email "actions@users.noreply.github.com"

          TMPDIR=$(mktemp -d)
          cp -a results "$TMPDIR/results"

          for ATTEMPT in 1 2 3; do
            echo "Persist attempt $ATTEMPT"
            git fetch origin main
            git reset --hard origin/main
            rm -rf results
            cp -a "$TMPDIR/results" results
            git add results/

            if git diff --cached --quiet; then
              echo "No research changes to commit."
              exit 0
            fi

            git commit -m "Update LOCENIX research results"
            if git push origin HEAD:main; then
              echo "Research results persisted successfully."
              exit 0
            fi
          done

          echo "Failed to persist research results after 3 attempts."
          exit 1
