name: LOCENIX CEO Agent 0

on:
  workflow_dispatch:
  push:
    paths:
      - 'wake_ceo.txt'
      - 'tasks/ceo_task.json'
      - 'tasks/agents/**'
      - 'tasks/departments/**'
      - 'agent/ceo_agent.py'
      - 'agent/ceo_customer_success_bridge.py'
      - 'agent/ceo_linkedin_control_bridge.py'
      - 'agent/ceo_outbound_accountability_bridge.py'
      - 'agent/ceo_execution_enforcer.py'
      - 'results/department_head_state.json'
      - 'results/customer_success_state.json'
      - 'results/email_sender_state.json'
  schedule:
    - cron: '15 6-18 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: locenix-ceo
  cancel-in-progress: false

jobs:
  executive-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Berlin executive-review slot
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Berlin'))
          print('run_review=' + ('true' if now.minute == 15 and 8 <= now.hour < 20 else 'false'))
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run_review == 'true'
        with:
          python-version: '3.12'

      - name: Run CEO Agent 0
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.ceo_agent

      - name: Merge Customer Success into CEO report
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.ceo_customer_success_bridge

      - name: Verify LinkedIn department execution control
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.ceo_linkedin_control_bridge

      - name: Enforce hard daily outbound accountability
        if: steps.gate.outputs.run_review == 'true'
        run: python -m agent.ceo_outbound_accountability_bridge

      - name: Enforce department execution
        if: steps.gate.outputs.run_review == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agent.ceo_execution_enforcer

      - name: Commit CEO report and directives
        if: steps.gate.outputs.run_review == 'true'
        run: |
          git config user.name 'locenix-ceo-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add results/ceo_latest.json results/ceo_state.json results/ceo_execution_state.json
          if [[ -f results/linkedin_directive.json ]]; then git add results/linkedin_directive.json; fi
          if git diff --cached --quiet; then
            echo 'No CEO report changes'
          else
            git commit -m 'Update LOCENIX CEO executive report and department accountability'
            git pull --rebase
            git push
          fi
