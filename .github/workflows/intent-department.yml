name: LOCENIX Agent 15 Intent Department

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - 'agent/intent_department_head.py'
      - 'agent/intent_scout_agent.py'
      - 'agent/intent_browser_fallback.py'
      - 'agent/intent_qa_agent.py'
      - 'agent/intent_response_agent.py'
      - 'agent/intent_learning_agent.py'
      - 'tasks/intent_department_task.json'
      - 'tasks/agents/agent_15*.json'
      - 'tasks/departments/agent_15*.json'
      - '.github/workflows/intent-department.yml'

permissions:
  contents: write

concurrency:
  group: locenix-intent-department
  cancel-in-progress: true

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: appuPKnVyLsbWbxMR
      AIRTABLE_TABLE_ID: tblF4ghkYFzkeQwsT
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Agent 15 browser runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run Agent 15A intent scout
        run: python -m agent.intent_scout_agent

      - name: Run Agent 15A cloud-browser fallback when HTTP discovery is blocked or empty
        run: python -m agent.intent_browser_fallback

      - name: Run Agent 15B QA and Airtable sync
        run: python -m agent.intent_qa_agent

      - name: Run Agent 15D response drafting
        run: python -m agent.intent_response_agent

      - name: Run Agent 15F learning optimizer
        run: python -m agent.intent_learning_agent

      - name: Run Agent 15 department head
        run: python -m agent.intent_department_head

      - name: Persist Agent 15 pipeline state
        run: |
          if [ -z "$(git status --porcelain -- results/intent_*.json)" ]; then
            echo 'No intent pipeline state changes.'
            exit 0
          fi
          git config user.name 'locenix-agent-15'
          git config user.email 'actions@users.noreply.github.com'
          git add results/intent_*.json
          git commit -m 'Update LOCENIX intent pipeline state'
          git push origin HEAD:main
